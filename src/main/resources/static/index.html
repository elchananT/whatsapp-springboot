<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse</title><script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script><style>body{margin:0;background:#e8ddd0;font-family:system-ui;color:#17231c}main{height:100vh;max-width:850px;margin:auto;background:#efeae2;display:grid;grid-template-rows:75px 1fr 70px}header{background:#075e54;color:white;display:flex;align-items:center;padding:0 25px;gap:12px}header b{font-size:20px}header small{opacity:.7}.dot{width:38px;height:38px;border-radius:50%;background:#25d366;display:grid;place-items:center}#messages{padding:24px;overflow:auto;background:linear-gradient(45deg,#e5ddd5dd,#e5ddd5dd),repeating-linear-gradient(45deg,#ddd 0 1px,transparent 1px 15px)}.message{max-width:72%;width:max-content;padding:9px 12px;background:#fff;border-radius:2px 9px 9px 9px;margin:9px 0;box-shadow:0 1px 1px #0001}.message.me{margin-left:auto;background:#d9fdd3;border-radius:9px 2px 9px 9px}.message b{display:block;font-size:11px;color:#075e54;margin-bottom:3px}.message small{display:block;text-align:right;color:#888;font-size:9px;margin-top:3px}form{display:flex;gap:10px;padding:12px 18px;background:#f0f2f5}input{border:0;border-radius:25px;padding:0 17px;font-size:15px;outline:0;flex:1}button{border:0;background:#075e54;color:white;border-radius:50%;width:46px;font-size:20px}#name{max-width:130px;flex:none;background:#ffffff55;color:white}@media(max-width:600px){main{width:100%}#name{max-width:90px}}</style></head><body><main><header><div class="dot">P</div><div><b>Pulse</b><small id="status">Connecting…</small></div><input id="name" value="You" aria-label="Your name"></header><section id="messages"><div class="message"><b>Pulse bot</b>Welcome — this is the general room.<small>now</small></div></section><form id="form"><input id="text" autocomplete="off" placeholder="Type a message" autofocus><button>➤</button></form></main><script>const out=document.querySelector('#messages'),name=document.querySelector('#name'),text=document.querySelector('#text'),status=document.querySelector('#status');let client=new StompJs.Client({webSocketFactory:()=>new SockJS('/ws'),reconnectDelay:3000});client.onConnect=()=>{status.textContent='Online';client.subscribe('/topic/rooms/general',m=>render(JSON.parse(m.body)))};client.onWebSocketClose=()=>status.textContent='Reconnecting…';client.activate();document.querySelector('#form').onsubmit=e=>{e.preventDefault();if(!text.value.trim()||!client.connected)return;client.publish({destination:'/app/chat.send',body:JSON.stringify({sender:name.value,content:text.value,room:'general'})});text.value=''};function render(m){let x=document.createElement('div');x.className='message '+(m.sender===name.value?'me':'');x.innerHTML='<b></b><span></span><small></small>';x.querySelector('b').textContent=m.sender;x.querySelector('span').textContent=m.content;x.querySelector('small').textContent=new Date(m.sentAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});out.append(x);out.scrollTop=out.scrollHeight}</script></body></html>
